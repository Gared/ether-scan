name: Prepare E2E environment
description: Cache Docker image, cache Composer packages, and install PHP dependencies

inputs:
  image:
    description: Docker image reference including tag (e.g. etherpad/etherpad:2.7.2)
    required: true

runs:
  using: composite
  steps:
    - name: Resolve cache file name
      id: cache-file
      shell: bash
      run: |
        set -euo pipefail
        cache_dir="/tmp/ether-scan-image-cache"
        image="${{ inputs.image }}"
        tag="${image##*:}"
        use_cache="false"
        if [[ "$tag" =~ [0-9] ]]; then
          use_cache="true"
        fi

        sanitized_image="$image"
        sanitized_image="${sanitized_image//\//-}"
        sanitized_image="${sanitized_image//:/-}"
        echo "file=${cache_dir}/${sanitized_image}.tar" >> "$GITHUB_OUTPUT"
        echo "key=docker-image-${{ runner.os }}-${sanitized_image}" >> "$GITHUB_OUTPUT"
        echo "use-cache=${use_cache}" >> "$GITHUB_OUTPUT"

    - name: Check cache for Docker image
      if: steps.cache-file.outputs.use-cache == 'true'
      id: docker-image-cache
      uses: actions/cache@v5
      with:
        path: /tmp/ether-scan-image-cache
        key: ${{ steps.cache-file.outputs.key }}

    - name: Load cached Docker image
      if: steps.cache-file.outputs.use-cache == 'true' && steps.docker-image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: docker image load --input "${{ steps.cache-file.outputs.file }}"

    - name: Pull and save Docker image on cache miss
      if: steps.cache-file.outputs.use-cache == 'true' && steps.docker-image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /tmp/ether-scan-image-cache
        docker pull "${{ inputs.image }}"
        docker image save "${{ inputs.image }}" --output "${{ steps.cache-file.outputs.file }}"

    - name: Pull Docker image without cache
      if: steps.cache-file.outputs.use-cache != 'true'
      shell: bash
      run: docker pull "${{ inputs.image }}"

    - name: Cache Composer packages
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      shell: bash
      run: composer install --prefer-dist --no-progress



